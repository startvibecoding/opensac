name: CI

# The release pipelines build straight from a tag, so without this gate a tag
# can publish npm packages and images that were never tested. This workflow runs
# the same checks `make test-all check lint check-fmt` does on the tree a release
# is cut from, so a red main is visible before anything is published.

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Check, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type check first: it is the cheapest signal and fails loudly on a broken
      # import graph before the slower suites run.
      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run fmt:check

      # Architecture guards live under src/ and therefore also run inside
      # `npm test`; they are named separately so a boundary regression points at
      # the guard rather than at whichever runtime test caught it.
      - name: Architecture guards
        run: npm run test:architecture

      - name: Test
        run: npm test

      # The published artifact is a platform-independent Node package; build it
      # here so a broken build pipeline fails CI rather than a release.
      - name: Build the Node package
        run: npm run build:node
