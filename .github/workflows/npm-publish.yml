name: Build and Publish npm Packages

# A tag publishes the single platform-independent package to both registries an
# opensac install can come from: npmjs.org as the unscoped `opensac`, and GitHub
# Packages as `@<owner>/opensac`. Both are built from the same
# `scripts/build_node.ts` the `make node-publish*` targets use.
#
# GitHub Packages needs no secret (it authenticates with GITHUB_TOKEN), so it
# runs on every tag. The npmjs job is gated on the `PUBLISH_NPMJS` repository
# variable and the `NPM_TOKEN` secret, so a fork without that name still gets a
# working GitHub Packages release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  DENO_VERSION: "2.9.7"
  NODE_VERSION: "22"

jobs:
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Publish the scoped package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make node-publish-github NODE_SCOPE=@${{ github.repository_owner }}

  publish-npmjs:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    # Secrets cannot be read from a job-level `if`, so the opt-in is the
    # PUBLISH_NPMJS repository variable. A fork or a maintainer who does not own
    # the npmjs name leaves it unset and only the GitHub Packages package is
    # published.
    if: ${{ vars.PUBLISH_NPMJS == 'true' }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Require the npm token
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::PUBLISH_NPMJS is enabled but the NPM_TOKEN secret is empty"
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Publish the package
        run: make node-publish
