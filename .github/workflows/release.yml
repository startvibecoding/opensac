name: Build and Publish Release

# A `v*` tag is the release. The only product artifact is the single
# platform-independent npm package built from that tag's commit, so the GitHub
# Release and the npm package can never describe different code.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Pinned so a release is reproducible and matches the version this repository
  # is developed against; setup-deno also caches DENO_DIR between runs.
  DENO_VERSION: "2.9.7"
  NODE_VERSION: "22"

jobs:
  release:
    name: Build the npm package and cut the release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify the tag is the version a build embeds
        run: |
          set -euo pipefail
          version="$(deno run -A scripts/version.ts)"
          echo "tag=${RELEASE_TAG} build version=${version}"
          if [ "${version}" != "${RELEASE_TAG}" ]; then
            echo "::error::the newest v* tag (${version}) is not ${RELEASE_TAG};" \
              "publishing this tag would ship another version's number"
            exit 1
          fi

      - name: Build the platform-independent npm package
        run: deno task build:node

      - name: Pack the npm tarball
        run: deno task pack:node

      - name: Checksum the artifact
        run: |
          set -euo pipefail
          find dist/npm -type f | LC_ALL=C sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          # A dash in the tag marks a pre-release, matching `make node-publish-pre`.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            dist/npm/*.tgz
            checksums.txt
